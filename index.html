<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>보보조조 - 디벗 & 보조배터리 스마트 케어</title>
  <style>
    :root {
      --bg-main: #F9FAFB;
      --bg-card: #FFFFFF;
      --bg-sub: #F2F4F6;
      --border: #E5E8EB;
      
      --text-main: #191F28;
      --text-sub: #6B7684;
      --text-muted: #8B95A1;
      
      --primary: #3B9DFF;
      --primary-light: #EAF4FF;
      --primary-dark: #1A73D9;
      
      --warn: #FFB300;
      --warn-bg: #FFF6DB;
      --danger: #F04452;
      --danger-bg: #FFEDEE;
      
      --radius-lg: 20px;
      --radius-md: 14px;
      --radius-sm: 8px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-main: #17171C;
        --bg-card: #202027;
        --bg-sub: #2C2C35;
        --border: #33333F;
        
        --text-main: #F9FAFB;
        --text-sub: #9EA7B3;
        --text-muted: #6B7684;
        
        --primary: #3B9DFF;
        --primary-light: #1E2D3D;
        --primary-dark: #58A6FF;
        
        --warn: #FFC107;
        --warn-bg: #3A3018;
        --danger: #FF5252;
        --danger-bg: #3D1E22;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Pretendard, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg-main); color: var(--text-main); display: flex; justify-content: center; min-height: 100vh; }
    
    #app { width: 100%; max-width: 1100px; background-color: var(--bg-main); min-height: 100vh; display: flex; flex-direction: column; position: relative; padding-bottom: 80px; }

    /* Top Bar */
    header { background-color: var(--bg-card); padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
    .logo-group { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 18px; color: var(--primary-dark); }
    .header-actions { display: flex; align-items: center; gap: 12px; }
    .status-indicator { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-sub); }
    .dot-online { width: 8px; height: 8px; background-color: var(--primary); border-radius: 50%; display: inline-block; animation: pulse 2s infinite; }
    
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }

    .icon-btn { background: none; border: none; cursor: pointer; position: relative; padding: 6px; color: var(--text-main); display: flex; align-items: center; justify-content: center; }
    .badge-count { position: absolute; top: 2px; right: 2px; background-color: var(--danger); color: white; font-size: 10px; font-weight: 700; border-radius: 10px; padding: 2px 5px; min-width: 16px; text-align: center; }

    /* Toggle Switch */
    .toggle-label { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--text-sub); cursor: pointer; }
    .toggle-switch { position: relative; width: 40px; height: 22px; background-color: var(--bg-sub); border-radius: 11px; transition: 0.2s; }
    .toggle-switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; background-color: white; border-radius: 50%; transition: 0.2s; }
    input[type="checkbox"]:checked + .toggle-switch { background-color: var(--primary); }
    input[type="checkbox"]:checked + .toggle-switch::after { transform: translateX(18px); }

    /* Demo Panel */
    .demo-panel { background-color: var(--bg-sub); padding: 10px 16px; border-bottom: 1px solid var(--border); font-size: 12px; display: flex; gap: 10px; align-items: center; overflow-x: auto; white-space: nowrap; }
    .demo-btn { background-color: var(--bg-card); border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; font-size: 11px; font-weight: 600; cursor: pointer; color: var(--text-main); }
    .demo-btn:active { transform: scale(0.96); }

    /* Alert Banner */
    .alert-banner { background-color: var(--danger-bg); color: var(--danger); padding: 12px 20px; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(240,68,82,0.2); }

    /* Main Container */
    main { padding: 20px; flex: 1; display: flex; flex-direction: column; gap: 20px; }

    /* UI Cards */
    .card { background-color: var(--bg-card); border-radius: var(--radius-lg); padding: 20px; border: 1px solid var(--border); display: flex; flex-direction: column; gap: 14px; }
    .card-title { font-size: 15px; font-weight: 600; color: var(--text-sub); display: flex; justify-content: space-between; align-items: center; }
    .big-stat { font-size: 42px; font-weight: 800; color: var(--text-main); letter-spacing: -1px; display: flex; align-items: baseline; gap: 6px; }
    .big-stat .unit { font-size: 20px; font-weight: 600; color: var(--text-sub); }

    /* Segmented Control */
    .segmented { display: flex; background-color: var(--bg-sub); padding: 3px; border-radius: var(--radius-md); gap: 2px; }
    .segmented-btn { flex: 1; border: none; background: none; padding: 8px; font-size: 13px; font-weight: 600; color: var(--text-sub); border-radius: 10px; cursor: pointer; text-align: center; transition: 0.2s; }
    .segmented-btn.active { background-color: var(--bg-card); color: var(--text-main); box-shadow: 0 2px 6px rgba(0,0,0,0.05); }

    /* Chips */
    .chip-group { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
    .chip { padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; background-color: var(--bg-sub); color: var(--text-sub); border: none; cursor: pointer; white-space: nowrap; }
    .chip.active { background-color: var(--primary-light); color: var(--primary-dark); }

    /* List Item Row */
    .list-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--border); cursor: pointer; }
    .list-row:last-child { border-bottom: none; }
    .list-info { display: flex; align-items: center; gap: 12px; }
    .list-icon { width: 40px; height: 40px; border-radius: 50%; background-color: var(--bg-sub); display: flex; align-items: center; justify-content: center; }
    .list-text { display: flex; flex-direction: column; gap: 2px; }
    .list-title { font-size: 15px; font-weight: 600; color: var(--text-main); }
    .list-desc { font-size: 13px; color: var(--text-sub); }
    .list-val { text-align: right; font-size: 14px; font-weight: 700; }

    /* Battery Icon SVG Graphic */
    .battery-pill { display: inline-flex; align-items: center; gap: 4px; padding: 4px 8px; border-radius: 6px; font-size: 12px; font-weight: 700; }
    .bat-high { background-color: var(--primary-light); color: var(--primary-dark); }
    .bat-mid { background-color: var(--warn-bg); color: #B78100; }
    .bat-low { background-color: var(--danger-bg); color: var(--danger); }

    /* Grid 5x5 */
    .grid-5x5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 10px; }
    .seat-cell { aspect-ratio: 1; background-color: var(--bg-sub); border-radius: var(--radius-sm); border: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer; font-size: 11px; font-weight: 700; position: relative; }
    .seat-cell.outlet-near { border-top: 3px solid var(--primary); }
    .seat-num { font-size: 10px; color: var(--text-muted); position: absolute; top: 4px; left: 4px; }

    /* Bottom Sheet Modal */
    .sheet-overlay { position: fixed; inset: 0; background-color: rgba(0,0,0,0.4); z-index: 200; display: flex; justify-content: center; align-items: flex-end; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
    .sheet-overlay.active { opacity: 1; pointer-events: auto; }
    .bottom-sheet { background-color: var(--bg-card); width: 100%; max-width: 1100px; border-top-left-radius: 24px; border-top-right-radius: 24px; padding: 24px 20px; display: flex; flex-direction: column; gap: 16px; transform: translateY(100%); transition: transform 0.25s ease-out; max-height: 85vh; overflow-y: auto; }
    .sheet-overlay.active .bottom-sheet { transform: translateY(0); }
    .sheet-handle { width: 36px; height: 4px; background-color: var(--border); border-radius: 2px; align-self: center; margin-bottom: 8px; }

    /* Bottom Navigation */
    nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 1100px; background-color: var(--bg-card); border-top: 1px solid var(--border); display: flex; height: 64px; z-index: 100; }
    .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: var(--text-muted); font-size: 11px; font-weight: 600; border: none; background: none; cursor: pointer; }
    .nav-item.active { color: var(--primary-dark); }

    /* Button CTA */
    .btn { width: 100%; height: 52px; border-radius: var(--radius-md); border: none; background-color: var(--primary); color: white; font-size: 16px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.1s; }
    .btn:active { transform: scale(0.97); }
    .btn-secondary { background-color: var(--bg-sub); color: var(--text-main); }
    .btn-danger { background-color: var(--danger-bg); color: var(--danger); }

    /* Form Elements */
    .form-group { display: flex; flex-direction: column; gap: 6px; text-align: left; }
    .form-label { font-size: 13px; font-weight: 600; color: var(--text-sub); }
    .form-input { height: 48px; border-radius: var(--radius-sm); border: 1px solid var(--border); padding: 0 14px; font-size: 15px; background-color: var(--bg-sub); color: var(--text-main); outline: none; }
    .form-input:focus { border-color: var(--primary); }

    /* Donut Chart SVG */
    .chart-box { display: flex; align-items: center; justify-content: space-around; }
    .donut-chart { transform: rotate(-90deg); width: 100px; height: 100px; }
    .donut-ring { fill: transparent; stroke: var(--bg-sub); stroke-width: 4; }
    .donut-segment { fill: transparent; stroke: var(--primary); stroke-width: 4; stroke-dasharray: 251.2; transition: stroke-dashoffset 0.5s; }

    /* School Map CSS Grid */
    .map-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; background-color: var(--bg-sub); padding: 12px; border-radius: var(--radius-md); position: relative; }
    .map-room { background-color: var(--bg-card); border-radius: var(--radius-sm); padding: 14px 8px; font-size: 12px; font-weight: 700; text-align: center; border: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .map-room.my-class { border: 2px solid var(--primary); background-color: var(--primary-light); }

    /* Table Responsive Card Fallback */
    .admin-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
    .admin-table th, .admin-table td { padding: 10px; text-align: left; border-bottom: 1px solid var(--border); }
    @media (max-width: 600px) {
      .admin-table thead { display: none; }
      .admin-table tr { display: block; background-color: var(--bg-sub); margin-bottom: 8px; border-radius: var(--radius-sm); padding: 8px; }
      .admin-table td { display: flex; justify-content: space-between; border: none; padding: 4px 6px; }
      .admin-table td::before { content: attr(data-label); font-weight: 600; color: var(--text-sub); }
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header>
      <div class="logo-group">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="16" height="10" rx="2" ry="2"/><line x1="22" y1="11" x2="22" y2="13"/><line x1="6" y1="11" x2="6" y2="13"/><line x1="10" y1="11" x2="10" y2="13"/></svg>
        보보조조
      </div>
      <div class="header-actions">
        <div class="status-indicator">
          <span class="dot-online"></span>
          <span id="last-updated-time">14:32:05</span>
        </div>
        <button class="icon-btn" onclick="openNotifications()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          <span class="badge-count" id="unread-count">0</span>
        </button>
        <label class="toggle-label">
          <input type="checkbox" id="admin-toggle" onchange="toggleAdminMode(this.checked)" hidden>
          <span class="toggle-switch"></span>
          관리자
        </label>
      </div>
    </header>

    <!-- Demo Control Bar -->
    <div class="demo-panel">
      <span>🛠️ 시연 패널:</span>
      <button class="demo-btn" onclick="demoFastForward()">시간 +10분</button>
      <button class="demo-btn" onclick="demoLowBattery()">배터리 강제 낮춤</button>
      <button class="demo-btn" onclick="demoTriggerFault()">보조배터리 고장발생</button>
      <button class="demo-btn" onclick="demoSimulateLeave()">교문이탈 시뮬레이션</button>
    </div>

    <!-- Alert Banner -->
    <div id="alert-banner-container"></div>

    <!-- Main Dynamic Content -->
    <main id="main-content"></main>

    <!-- Bottom Navigation -->
    <nav>
      <button class="nav-item active" onclick="switchTab('home')" id="nav-home">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        홈
      </button>
      <button class="nav-item" onclick="switchTab('dibot')" id="nav-dibot">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
        디벗
      </button>
      <button class="nav-item" onclick="switchTab('aux')" id="nav-aux">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="16" height="10" rx="2"/><line x1="22" y1="11" x2="22" y2="13"/></svg>
        보조배터리
      </button>
      <button class="nav-item" onclick="switchTab('myaux')" id="nav-myaux">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        내 배터리
      </button>
      <button class="nav-item" onclick="switchTab('map')" id="nav-map">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="1 6 1 22 8 18 15 22 23 18 23 2 15 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="15" y1="6" x2="15" y2="22"/></svg>
        지도·대여
      </button>
    </nav>

    <!-- Bottom Sheet Modal Container -->
    <div class="sheet-overlay" id="sheet-overlay" onclick="closeSheet(event)">
      <div class="bottom-sheet" onclick="event.stopPropagation()">
        <div class="sheet-handle"></div>
        <div id="sheet-body"></div>
      </div>
    </div>
  </div>

  <script>
    /================================================================
     * [0] 설정 및 텍스트 데이터 (사용자 수정 영역)
     ================================================================/
    const SCORE_RULES = {
      CHARGE_BEFORE_DISMISSAL: 10,
      BATTERY_80_AT_ARRIVAL: 10,
      RETURN_AUX_ON_TIME: 15,
      RETURN_AUX_LATE: -10,
      BRING_REGISTERED_AUX: 5,
      LEFT_BEHIND_WARNING: -5,
      REPORT_FAULT: 5,
      ACTION_AFTER_ALERT: 5
    };

    const TEACHER_DATA = {
      homeroom: "이○○ 선생님",
      gradeClass: "2학년 3반",
      totalStudents: 25,
      notice: "오늘 디벗 수업 전 충전 상태를 꼭 확인해요",
      timetable: [
        { period: 1, time: "09:00", subject: "국어", dibot: false },
        { period: 2, time: "09:55", subject: "수학", dibot: false },
        { period: 3, time: "10:50", subject: "영어", dibot: true },
        { period: 4, time: "11:45", subject: "체육", dibot: false },
        { period: 5, time: "13:20", subject: "과학", dibot: true },
        { period: 6, time: "14:15", subject: "사회", dibot: false }
      ]
    };

    const TEXT = {
      readiness: {
        safe: { title: "수업 준비 완료!", desc: "수업 끝까지 배터리가 충분해요.", tip: "보조배터리 없이 편하게 수업에 참여하세요." },
        caution: { title: "배터리 주의 필요", desc: "수업 중간에 꺼질 위험이 있어요.", tip: "미리 보조배터리를 대여해두는 것을 추천해요." },
        danger: { title: "충전이 시급해요!", desc: "수업 시작 전 배터리가 부족해요.", tip: "가까운 충전 스테이션이나 교실 뒷면 콘센트를 이용하세요." }
      },
      habits: {
        king: { title: "충전 왕 👑", desc: "완벽한 충전 습관을 가지고 계시네요!", tip: "지금처럼 주변 친구들에게 충전 꿀팁을 공유해 보세요." },
        master: { title: "충전 고수 🥈", desc: "우수한 충전 관리를 하고 있어요.", tip: "하교 전 디벗 충전기 연결만 한 번 더 확인하면 충전 왕!" },
        sprout: { title: "충전 새싹 🌱", desc: "조금만 더 신경 쓰면 좋아질 거예요.", tip: "등교 직후 디벗 잔량이 80% 이상인지 체크하는 습관을 가져보세요." },
        trainee: { title: "충전 연습생 🐣", desc: "디벗이 자주 아파하고 있어요.", tip: "하교 전 충전 케이블을 꽂는 알람을 설정해 보세요." }
      },
      warnings: {
        lowBattery: "🚨 내 디벗 배터리가 20% 이하입니다! 충전이 필요합니다.",
        leftBehind: "⚠️ 등록한 보조배터리를 교실에 두고 나왔어요! 확인해 보세요.",
        overdue: "⏰ 대여 중인 보조배터리 반납 시간이 초과되었습니다!"
      }
    };

    /================================================================
     * [1] 앱 데이터 State 초기화
     ================================================================/
    let state = {
      activeTab: 'home',
      adminMode: false,
      currentTime: "10:15", // 시연 가상 시간
      myDibotId: 12,
      dibots: Array.from({ length: 25 }, (_, i) => ({
        id: i + 1,
        studentName: `김OO_${i + 1}`,
        battery: Math.floor(Math.random() * 60) + 30,
        isCharging: Math.random() > 0.5,
        location: i === 11 ? "내 교실" : (Math.random() > 0.3 ? "충전 보관함" : "이동 중(특별실)"),
        health: "양호"
      })),
      auxBatteries: Array.from({ length: 12 }, (_, i) => ({
        id: `BB-${String(i + 1).padStart(2, '0')}`,
        battery: Math.floor(Math.random() * 50) + 50,
        status: i === 2 ? "고장" : (i === 4 ? "대여 중" : (i % 2 === 0 ? "충전 완료" : "충전 중")),
        location: i === 4 ? "김OO_5" : `충전 스테이션 ${i % 2 + 1}`,
        renter: i === 4 ? "김OO_5" : "-",
        dueTime: i === 4 ? "11:35" : "-",
        capacity: 10000,
        watt: 45,
        canChargeLaptop: true,
        faultReport: i === 2 ? { symptom: "충전 안됨", time: "09:10", reporter: "김OO_3", status: "수리 대기" } : null
      })),
      myAuxBatteries: loadStorage('myAuxBatteries', [
        { id: 'MY-01', name: '내 파랑이', capacity: 10000, color: '스카이 블루', tag: 'TAG-992', battery: 85, isCharging: false, status: '가방 안에 있음' }
      ]),
      checklist: loadStorage('checklist', { c1: true, c2: false, c3: false }),
      score: 85,
      notifications: [
        { id: 1, title: "배터리 충전 알림", msg: "3교시 영어(디벗) 수업 10분 전입니다. 현재 잔량 32%", read: false, time: "10:40" },
        { id: 2, title: "대여 안내", msg: "보조배터리 BB-01 대여가 완료되었습니다.", read: true, time: "09:00" }
      ],
      rentedCount: 1,
      mapFloor: 1,
      viewModeDibot: 'cabinet'
    };

    function loadStorage(key, fallback) {
      try {
        const item = localStorage.getItem(key);
        return item ? JSON.parse(item) : fallback;
      } catch (e) {
        return fallback;
      }
    }

    function saveStorage(key, value) {
      try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
    }

    /================================================================
     * [2] 알림 및 유틸리티 함수
     ================================================================/
    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
    }

    function getGrade(score) {
      const s = Math.min(100, Math.max(0, score));
      if (s >= 90) return { name: "충전 왕", key: "king" };
      if (s >= 70) return { name: "충전 고수", key: "master" };
      if (s >= 40) return { name: "충전 새싹", key: "sprout" };
      return { name: "충전 연습생", key: "trainee" };
    }

    function getReadiness() {
      const myDibot = state.dibots.find(d => d.id === state.myDibotId);
      // 필요 배터리 계산: 소요시간 45분 * 15 / 60 = 11.25%
      const required = 11.25;
      const margin = myDibot.battery - required;
      if (margin >= 20) return { grade: "안전", key: "safe", color: "var(--primary-dark)" };
      if (margin >= 0) return { grade: "주의", key: "caution", color: "var(--warn)" };
      return { grade: "위험", key: "danger", color: "var(--danger)" };
    }

    /================================================================
     * [3] 렌더링 코어 엔진
     ================================================================/
    function render() {
      // 1. 헤더 실시간 정보 & 알림 배지
      document.getElementById('unread-count').innerText = state.notifications.filter(n => !n.read).length;
      document.getElementById('admin-toggle').checked = state.adminMode;
      
      // 2. 경고 배너 렌더링
      const bannerBox = document.getElementById('alert-banner-container');
      const myDibot = state.dibots.find(d => d.id === state.myDibotId);
      const leftBehindAux = state.myAuxBatteries.find(a => a.status === '교실에 두고 나옴');

      if (myDibot.battery <= 20) {
        bannerBox.innerHTML = `<div class="alert-banner">${TEXT.warnings.lowBattery}</div>`;
      } else if (leftBehindAux) {
        bannerBox.innerHTML = `<div class="alert-banner">${TEXT.warnings.leftBehind}</div>`;
      } else {
        bannerBox.innerHTML = '';
      }

      // 3. 네비게이션 활성화 표시
      document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
      const activeNav = document.getElementById(`nav-${state.activeTab}`);
      if (activeNav) activeNav.classList.add('active');

      // 4. 메인 뷰 분기
      const main = document.getElementById('main-content');
      if (state.adminMode) {
        main.innerHTML = renderAdminView();
      } else {
        switch (state.activeTab) {
          case 'home': main.innerHTML = renderHomeTab(); break;
          case 'dibot': main.innerHTML = renderDibotTab(); break;
          case 'aux': main.innerHTML = renderAuxTab(); break;
          case 'myaux': main.innerHTML = renderMyAuxTab(); break;
          case 'map': main.innerHTML = renderMapTab(); break;
        }
      }
    }

        </div>
        <button class="btn" onclick="confirmRent('${avail.id}')">대여 완료하기</button>
      `);
    }

    function confirmRent(id) {
      const item = state.auxBatteries.find(a => a.id === id);
      if (item) {
        item.status = "대여 중";
        item.location = "내 교실";
        item.renter = "김OO_12";
      }
      render();
      closeSheet();
    }

    function reportFault(id) {
      const item = state.auxBatteries.find(a => a.id === id);
      if (item) {
        item.status = "점검 필요";
        item.faultReport = { symptom: "사용자 고장 접수", time: "방금 전", reporter: "김OO_12", status: "수리 대기" };
      }
      render();
      closeSheet();
      alert('고장 신고가 접수되었습니다.');
    }

    // 내 보조배터리 등록 시트
    function openRegisterMyAuxSheet() {
      openSheet(`
        <h3>➕ 내 보조배터리 등록</h3>
        <div class="form-group" style="margin-top:12px;">
          <label class="form-label">별명</label>
          <input type="text" id="reg-name" class="form-input" placeholder="예: 파랑이">
        </div>
        <div class="form-group" style="margin-top:8px;">
          <label class="form-label">태그 번호</label>
          <input type="text" id="reg-tag" class="form-input" placeholder="예: TAG-104">
        </div>
        <button class="btn" style="margin-top:16px;" onclick="saveMyAux()">등록하기</button>
      `);
    }

    function saveMyAux() {
      const name = document.getElementById('reg-name').value.trim();
      const tag = document.getElementById('reg-tag').value.trim();
      if (!name || !tag) { alert('모든 필드를 입력해 주세요.'); return; }

      state.myAuxBatteries.push({
        id: `MY-${Date.now()}`,
        name: name,
        capacity: 10000,
        color: '스카이 블루',
        tag: tag,
        battery: 100,
        isCharging: false,
        status: '가방 안에 있음'
      });
      saveStorage('myAuxBatteries', state.myAuxBatteries);
      render();
      closeSheet();
    }

    function deleteMyAux(id) {
      if (confirm('정말 삭제하시겠습니까?')) {
        state.myAuxBatteries = state.myAuxBatteries.filter(a => a.id !== id);
        saveStorage('myAuxBatteries', state.myAuxBatteries);
        render();
      }
    }

    function openNotifications() {
      const items = state.notifications.map(n => `
        <div class="list-row" onclick="n.read=true; render();">
          <div class="list-text">
            <span class="list-title">${escapeHtml(n.title)}</span>
            <span class="list-desc">${escapeHtml(n.msg)}</span>
          </div>
          <span style="font-size:11px; color:var(--text-sub);">${n.time}</span>
        </div>
      `).join('');

      openSheet(`
        <h3>🔔 알림 센터</h3>
        <div style="margin-top:12px;">${items.length ? items : '알림이 없습니다.'}</div>
      `);
      state.notifications.forEach(n => n.read = true);
      render();
    }

    /================================================================
     * [6] 시연 패널 가상 시뮬레이션
     ================================================================/
    function demoFastForward() {
      state.dibots.forEach(d => {
        if (d.isCharging) d.battery = Math.min(100, d.battery + 8);
        else d.battery = Math.max(0, d.battery - 5);
      });
      render();
    }

    function demoLowBattery() {
      const myDibot = state.dibots.find(d => d.id === state.myDibotId);
      myDibot.battery = 15;
      myDibot.isCharging = false;
      render();
    }

    function demoTriggerFault() {
      state.auxBatteries[0].status = '고장';
      state.auxBatteries[0].faultReport = { symptom: "발열 심함", time: "방금 전", reporter: "시스템 감지", status: "점검 필요" };
      render();
    }

    function demoSimulateLeave() {
      if (state.myAuxBatteries.length > 0) {
        state.myAuxBatteries[0].status = '교실에 두고 나옴';
        render();
      }
    }

    // 5초마다 자동 데이터 미세 변동 시뮬레이션
    setInterval(() => {
      const now = new Date();
      document.getElementById('last-updated-time').innerText = now.toTimeString().split(' ')[0];
    }, 5000);

    // 초기 실행
    render();
  </script>
</body>
</html>
